name: GitHub-Profile-3D-Contrib
on:
  schedule:
    - cron: "0 0 * * 0"  # Runs every Sunday at midnight (00:00) UTC
  workflow_dispatch:     # Keep this so you can still run it manually
  
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - name: GitHub-Profile-3D-Contrib-2022
        uses: xgqfrms/github-profile-3d-contrib-2022@v0.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated 3d contribution graph"
          git push
